---
# ----------------------------------------------------------------------------
# Optional functional coverage, following ecc_coverage.
# Covergroups also require FCOV, avoiding sampling overhead in non-coverage runs.
# ----------------------------------------------------------------------------
provides: [rsa_coverage]
schema_version: 2.4.0
requires:
  - tessera_rsa_top
targets:
  tb:
    directories:
      - $COMPILE_ROOT/coverage
    files:
      - $COMPILE_ROOT/coverage/rsa_top_cov_if.sv
      - $COMPILE_ROOT/coverage/rsa_top_cov_bind.sv
global:
  tool:
    vcs:
      default:
        - '-assert svaext'
        - +define+CLP_ASSERT_ON
        - '-noinherit_timescale=1ns/1ps'
