uvmf:
  environments:
    RSA:
    
      agents:
      - name: RSA_in_agent
        type: RSA_in
        initiator_responder: "INITIATOR"
      - name: RSA_out_agent
        type: RSA_out
        initiator_responder: "RESPONDER"
    
      analysis_components:
      - name: RSA_pred
        type: RSA_predictor
      analysis_exports: []
      analysis_ports: []
    
      config_constraints: []
      config_vars: []
    
      parameters: []
    
      scoreboards:
      - name: RSA_sb
        sb_type: uvmf_in_order_scoreboard
        trans_type: RSA_out_transaction
    
      subenvs: []
    
      tlm_connections:
      - driver: RSA_in_agent.monitored_ap            # connection 00
        receiver: RSA_pred.RSA_in_agent_ae
      - driver: RSA_pred.RSA_sb_ap                   # connection 01
        receiver: RSA_sb.expected_analysis_export
      - driver: RSA_out_agent.monitored_ap           # connection 02
        receiver: RSA_sb.actual_analysis_export