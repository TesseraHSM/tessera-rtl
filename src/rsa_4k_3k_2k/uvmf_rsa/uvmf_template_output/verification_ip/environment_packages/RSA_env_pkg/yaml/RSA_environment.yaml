uvmf:
  environments:
    RSA:
      agents:
      - initiator_responder: INITIATOR
        name: RSA_in_agent
        type: RSA_in
      - initiator_responder: RESPONDER
        name: RSA_out_agent
        type: RSA_out
      analysis_components:
      - name: RSA_pred
        parameters: []
        type: RSA_predictor
      analysis_exports: []
      analysis_ports: []
      config_constraints: []
      config_vars: []
      existing_library_component: 'True'
      hvl_pkg_parameters: []
      non_uvmf_components: []
      parameters: []
      qvip_memory_agents: []
      scoreboards:
      - name: RSA_sb
        sb_type: uvmf_in_order_scoreboard
        trans_type: RSA_out_transaction
      subenvs: []
      tlm_connections:
      - driver: RSA_in_agent.monitored_ap
        receiver: RSA_pred.RSA_in_agent_ae
        validate: 'True'
      - driver: RSA_pred.RSA_sb_ap
        receiver: RSA_sb.expected_analysis_export
        validate: 'True'
      - driver: RSA_out_agent.monitored_ap
        receiver: RSA_sb.actual_analysis_export
        validate: 'True'
